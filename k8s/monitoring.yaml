apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sgr-prod
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'sgr-prod'
    
    alerting:
      alertmanagers:
      - static_configs:
        - targets: []
    
    rule_files:
    - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
    - job_name: 'sgr-api'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - sgr-prod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: sgr-api
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        replacement: ${1}:8000
    
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

  alerts.yml: |
    groups:
    - name: sgr-alerts
      interval: 30s
      rules:
      - alert: SGRAPIDown
        expr: up{job="sgr-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SGR API is down"
          
      - alert: HighErrorRate
        expr: rate(http_requests_total{job="sgr-api",status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate (>5%)"
          
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{pod=~"sgr-api.*"} / 1073741824 > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage (>90%)"

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sgr-prod
spec:
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sgr-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.52.0
        ports:
        - containerPort: 9090
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=30d'
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: sgr-prod

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sgr-prod
