apiVersion: v1
kind: Secret
metadata:
  name: sgr-secrets
  namespace: sgr-prod
type: Opaque
stringData:
  # Database
  DB_HOST: "postgres.sgr-prod.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "sgr"
  DB_PASSWORD: "changeme-prod"
  DB_NAME: "sgr"

  # Redis
  REDIS_HOST: "redis.sgr-prod.svc.cluster.local"
  REDIS_PORT: "6379"

  # API
  API_SECRET_KEY: "changeme-min-32-chars-for-prod-key"
  ENCRYPTION_MASTER_KEY: "changeme-32-byte-key-for-prod"

  # Exchange (paper trading – no real keys needed)
  PIONEX_PAPER_API_KEY: ""
  PIONEX_PAPER_SECRET: ""

  # Monitoring
  MONITORING_SENTRY_DSN: ""
  MONITORING_TELEGRAM_BOT_TOKEN: ""
  MONITORING_TELEGRAM_CHAT_ID: ""
