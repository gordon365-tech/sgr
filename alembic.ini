[alembic]
script_location = alembic
prepend_sys_path = .

# Fallback-URL, NUR wirksam wenn env.py aus irgendeinem Grund nicht greift.
# Zur Laufzeit überschreibt alembic/env.py:get_url() diesen Wert immer aus
# DATABASE_URL bzw. DB_* Env-Variablen (siehe env.py für die Priorität).
#
# Dieser Fallback zeigt bewusst auf localhost:5433 (Host-Port aus
# docker/docker-compose.yml), NICHT auf den Docker-internen Hostnamen
# "postgres:5432" - Alembic wird typischerweise lokal vom Entwickler-Host
# aus aufgerufen (siehe README "Running the API without Docker"), nicht aus
# einem Container heraus. Innerhalb von Docker liefert env.py ohnehin die
# korrekte DB_HOST=postgres/DB_PORT=5432 Kombination aus den Compose-Envs.
#
# Achtung Port-Falle: env.py's eigener Fallback (ohne jegliche ENV-Vars
# gesetzt) nutzt bewusst DB_PORT=5432 als generischen Postgres-Standard-Port,
# NICHT 5433 - das greift aber nur, wenn env.py überhaupt Zugriff auf
# os.environ hat. Ohne .env-Datei UND ohne diese hier hinterlegte
# alembic.ini-URL würde ein lokaler "alembic upgrade head" auf Port 5432
# statt 5433 zielen und fehlschlagen. Verlässlichster Weg: immer eine lokale
# .env aus .env.example anlegen (setzt DB_PORT=5433 explizit).
sqlalchemy.url = postgresql+asyncpg://sgr:changeme@localhost:5433/sgr

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
