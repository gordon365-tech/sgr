
# Project SGR – Production-Grade Docker Stack
# 
# Services:
# - API (REST + WebSocket)
# - Worker (Trading Engine)
# - PostgreSQL/TimescaleDB (Persistence)
# - Redis (Event Bus + Cache)
# - Prometheus (Metrics)
# - Grafana (Dashboards)
#
# Network Topology:
#   [ Public ]
#       ↓
#   [Ingress / Reverse Proxy]
#       ↓
#   [ Internal Network ]
#       ├── api (port 8000)
#       ├── worker-gordon, worker-sumo (ein Container pro Tenant,
#       │   Commit 5: Isolation durch OS-Prozesstrennung)
#       ├── postgres (port 5432 internal only)
#       ├── redis (port 6379 internal only)
#       ├── prometheus (port 9090 internal, optional external)
#       └── grafana (port 3001)
#
# Usage:
#   docker compose -f docker/docker-compose.prod.yml up -d
#   docker compose -f docker/docker-compose.prod.yml ps
#   docker compose -f docker/docker-compose.prod.yml logs -f api

networks:
  sgr-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  # =========================================================================
  # PostgreSQL / TimescaleDB (Persistence Layer)
  # =========================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sgr-postgres
    hostname: postgres
    networks:
      sgr-net:
        ipv4_address: 172.28.1.10
    
    # env_file liefert POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB.
    # WICHTIG: diese duerfen NICHT zusaetzlich unter environment: mit
    # ${VAR:-default} gesetzt werden - Compose interpoliert solche
    # Ausdruecke beim YAML-Parsing aus der Shell-Umgebung, bevor env_file
    # geladen wird, und ein environment-Key hat immer Vorrang vor
    # env_file. Das hatte zuvor zur Folge, dass Postgres beim allerersten
    # Volume-Init immer mit dem Fallback change_me_in_production
    # initialisiert wurde, unabhaengig vom echten Wert in .env.prod.
    env_file:
      - path: ../.env.prod
        required: false
      - path: ../.env
        required: false
    
    environment:
      TZ: UTC
      
      # TimescaleDB Tuning
      # Für Production: Memory auf Hostoberflaeche anpassen
      # shared_buffers = 25% des RAM, max_connections = 200+
      POSTGRES_INIT_ARGS: >
        -c shared_buffers=256MB
        -c max_connections=200
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c work_mem=4MB
        
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init-Script nur beim ersten Start
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      
    ports:
      # Internal access nur von anderen Containers
      # Falls lokales psql noetig: expose aber NICHT im default docker-compose
      # Security-Audit 2026-09-16: war zuvor an 0.0.0.0 gebunden (auf allen
      # Interfaces oeffentlich erreichbar, nur durch das DB-Passwort
      # geschuetzt). Jetzt auf localhost beschraenkt - bleibt fuer
      # Admin-/Debug-Zugriff per SSH auf den Host erreichbar, sgr-api/
      # worker erreichen Postgres ohnehin ueber den internen Docker-
      # Netzwerk-Servicenamen "postgres", nicht ueber diesen Host-Port.
      - "127.0.0.1:5432:5432"
      
    healthcheck:
      # $$-Escaping erzwingt Shell-Expansion zur Laufzeit IM Container
      # (wo POSTGRES_USER/POSTGRES_DB aus env_file real gesetzt sind),
      # statt Compose-Parse-Zeit-Interpolation mit falschem Fallback.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # =========================================================================
  # Redis (Event Bus + Session Cache)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: sgr-redis
    hostname: redis
    networks:
      sgr-net:
        ipv4_address: 172.28.1.11
        
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --daemonize no
      --loglevel notice
      
    volumes:
      - redisdata:/data
      
    ports:
      # Security-Audit 2026-09-16: war an 0.0.0.0 gebunden UND ganz ohne
      # Auth erreichbar (kein "requirepass" konfiguriert, obwohl
      # REDIS_PASSWORD in .env.prod existiert - nie an den redis-Service
      # durchgereicht). Auf localhost beschraenkt, analog zu Postgres
      # oben - sgr-api/worker erreichen Redis ueber den internen
      # Servicenamen "redis", nicht ueber diesen Host-Port.
      - "127.0.0.1:6379:6379"
      
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # =========================================================================
  # Prometheus (Metrics Collection)
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sgr-prometheus
    hostname: prometheus
    networks:
      sgr-net:
        ipv4_address: 172.28.1.12
        
    ports:
      - "9090:9090"  # Keep for monitoring, restrict via ingress
      
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
      
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"  # Allow config reload via HTTP
      
    healthcheck:
      # prom/prometheus ist busybox-basiert und bringt wget mit (kein
      # curl). /-/healthy ist Prometheus' eingebauter Liveness-Endpoint.
      # Ohne diesen Healthcheck bleibt der Container-Status dauerhaft
      # "running" ohne Health-Wert (siehe docker inspect), wodurch
      # grafana's depends_on: prometheus: condition: service_healthy
      # nie erfuellt werden kann und docker compose up fehlschlaegt.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =========================================================================
  # Grafana (Dashboards)
  # =========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sgr-grafana
    hostname: grafana
    networks:
      sgr-net:
        ipv4_address: 172.28.1.13
        
    ports:
      - "3001:3000"
      
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_SECURITY_LOGIN_ATTEMPTS_MAX_LIFETIME: 300
      GF_SECURITY_LOGIN_MAX_ATTEMPTS: 5
      GF_INSTALL_PLUGINS: ""
      TZ: UTC
      
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      
    depends_on:
      prometheus:
        condition: service_healthy
        
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # =========================================================================
  # SGR API (FastAPI – REST + WebSocket)
  # =========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    image: sgr-api:latest
    container_name: sgr-api
    hostname: api
    networks:
      sgr-net:
        ipv4_address: 172.28.1.20
        
    ports:
      - "8000:8000"
      
    # Environment
    env_file:
      - path: ../.env.prod
        required: false
      - path: ../.env
        required: false
        
    environment:
      # Override Compose-interne Service-Hostnamen
      # DB_USER/DB_PASSWORD/DB_NAME werden bewusst NICHT hier gesetzt:
      # Compose interpoliert ${VAR:-default} beim YAML-Parsing aus der
      # Shell-Umgebung, BEVOR env_file geladen wird. Ein hier gesetzter
      # environment-Key hat immer Vorrang vor env_file, daher wuerde ein
      # Override wie DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      # den Fallback fest einbrennen, sobald die Shell-Variable nicht
      # gesetzt ist - unabhaengig vom tatsaechlichen Wert in .env.prod/.env.
      # Diese drei Werte muessen daher ausschliesslich aus env_file kommen.
      DB_HOST: postgres
      DB_PORT: "5432"
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      
      ENVIRONMENT: production
      TRADING_MODE: paper  # NEVER use 'live' in default config
      
      # Logging
      LOG_LEVEL: info
      
      # API
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_WORKERS: "4"
      
      # Sentry (if configured)
      SENTRY_DSN: ${SENTRY_DSN:-}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        
    # Health Checks
    healthcheck:
      # Liveness: Is process alive?
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false  # Needs write for temp files
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # =========================================================================
  # SGR Worker (Trading Engine - separater Container, ein Container pro
  # Tenant, Commit 5 Option A: Isolation durch OS-Prozesstrennung statt
  # In-Memory-Multiplexing im API-Prozess, siehe sgr/core/config.py
  # SGRConfig.tenant_id Docstring und sgr/core/tenant_credentials.py)
  # =========================================================================
  worker-gordon:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: sgr-worker:latest
    container_name: sgr-worker-gordon
    hostname: worker-gordon
    networks:
      sgr-net:
        ipv4_address: 172.28.1.21
        
    # NO ports exposed - internal only
    
    # Environment (identisch wie API, aber anderer CMD)
    env_file:
      - path: ../.env.prod
        required: false
      - path: ../.env
        required: false
        
    environment:
      # Siehe Kommentar beim api-Service oben: DB_USER/DB_PASSWORD/DB_NAME
      # duerfen hier nicht mit ${VAR:-default} gesetzt werden, sonst wird
      # der Default fest eingebrannt statt aus env_file gelesen zu werden.
      DB_HOST: postgres
      DB_PORT: "5432"
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      
      ENVIRONMENT: production
      TRADING_MODE: paper
      
      LOG_LEVEL: info
      
      WORKER_ROLE: trading
      # Multi-Tenant-Worker: laedt Exchange-Credentials aus der DB
      # (APIKeyModel, ueber POST /api-keys hinterlegt) statt aus .env,
      # siehe sgr/core/tenant_credentials.py. MUSS die tatsaechliche
      # users.id-UUID sein (z.B. per SELECT id FROM users WHERE email =
      # 'gordon@...' ermittelt), NICHT ein sprechender Name - ein
      # Klartext-Wert wie "gordon" scheitert an der UUID-Validierung in
      # load_tenant_credentials() mit einer klaren Fehlermeldung
      # (frueher: kryptischer asyncpg.exceptions.DataError, siehe
      # Deployment-Vorfall). Platzhalter unten MUSS vor dem Start durch
      # die echte UUID ersetzt werden.
      TENANT_ID: a47d994d-35cc-4619-83bb-86fd0cb48447

      # Manueller Override auf explizite operative Anweisung (siehe
      # sgr/api/main.py lifespan() Kommentar bei STRATEGY_FORCE_ACTIVATE):
      # beide registrierten Strategien bestehen die automatische
      # Backtest+Walk-Forward-Validierung NICHT (trend_following_v1:
      # NO-GO, OOS-Sharpe -7.2; mean_reversion_v1: Klassifikation C -
      # grundsaetzlich ungeeignet, siehe
      # docs/ANALYSIS-mean-reversion-v1-schritt18-*.md), werden hier aber
      # trotzdem fuer einen reinen Paper-Trading-Pipeline-Testlauf
      # scharf geschaltet - KEIN Live-Trading-Freigabe, kein
      # oekonomisch validiertes Signal. Leer lassen/entfernen, um zum
      # sicheren Default (0 aktive Strategien bei fehlgeschlagener
      # Validierung) zurueckzukehren.
      #
      # TEST_1X-Deployment (2026-09-16): NUR NOCH EINE Strategie aktiv
      # (trend_following_v1) statt beider - siehe Aufgabenstellung
      # "STRATEGIEN: nicht gleichzeitig alle Strategien aktivieren".
      # trend_following_v1 bleibt die am wenigsten komplexe der beiden
      # jemals TATSAECHLICH validierten Strategien (mean_reversion_v1 hat
      # 8+ iterative Analyse-Dokumente, die auf hoehere Fragilitaet
      # hindeuten) - dies ist weiterhin ein reiner Lifecycle-Test, KEINE
      # oekonomische Validierung oder Live-Freigabe.
      # Aggressive PAPER-Validierungsphase (2026-09-22, operative
      # Anweisung): zusaetzlich momentum_v1/breakout_v1/
      # volatility_adjusted_momentum_v1 aktiviert - identischer
      # Override-Mechanismus wie trend_following_v1 oben, gleiche
      # live_approved=False-Garantie (siehe apply_strategy_force_
      # activate_override() in sgr/api/main.py), keine neue Logik.
      # futures_grid_*-Strategien bewusst NICHT aktiviert - sie haben
      # keine bestehende Grid-Parameter-Konfiguration in diesem File.
      # 2026-09-24, operative Anweisung ("gehe viel auf future grid"):
      # futures_grid_long_v1/futures_grid_short_v1/futures_grid_adaptive_v1
      # ergaenzt. Grid-Strategien handeln nicht ueber den direktionalen
      # Signal-Pfad (siehe futures_grid.py Modul-Docstring) - ihre
      # Aktivierung hier allein oeffnet noch KEIN Grid, das erfordert
      # zusaetzlich GRID_SCHEDULER_ENABLED=true (siehe unten).
      STRATEGY_FORCE_ACTIVATE: "trend_following_v1,momentum_v1,breakout_v1,volatility_adjusted_momentum_v1,futures_grid_long_v1,futures_grid_short_v1,futures_grid_adaptive_v1"
      # 2026-09-24, operative Anweisung: schaltet GridScheduler.on_candle_
      # event() von einem No-Op (Default) auf tatsaechliches Grid-Opening
      # um (siehe sgr/orchestrator/grid_scheduler.py Modul-Docstring).
      # PAPER only (config.trading_mode fuer Gordon/Sumo) - kein Live-
      # Trading-Effekt.
      GRID_SCHEDULER_ENABLED: "true"

      # PAPER-Stress-Test Auto-Recovery (2026-09-22, explizite operative
      # Anweisung): automatischer Kill-Switch-Reset NUR wenn der Tenant
      # 0 offene Positionen haelt (siehe PositionProtectionWatchdog.
      # enable_paper_stress_auto_recovery() Docstring fuer die
      # vollstaendige Begruendung + Live-Sperre). Hart auf PAPER
      # beschraenkt im Code selbst, unabhaengig von dieser Variable.
      PAPER_STRESS_AUTO_RECOVERY_ENABLED: "true"

      # TEST_1X Risk Profile (kontrollierter Funktionstest, Position-
      # Protection-Deployment 2026-09-16) - NUR fuer Gordon, Sumo bleibt
      # unveraendert (eigener .env.prod-Wert RISK_MAX_LEVERAGE=3.0 etc.
      # bleibt fuer Sumo unberuehrt, da diese Overrides ausschliesslich
      # hier im worker-gordon-Service stehen, nicht in .env.prod).
      #
      # WICHTIG (Fund waehrend dieses Deployments): der aktuelle
      # ExchangePool.initialize()-Aufruf in sgr/api/main.py uebergibt
      # KEIN futures_mode=True - Gordon (wie Sumo) handelt seit jeher
      # Binance SPOT, nicht Futures, trotz der umfangreichen Futures-
      # Architektur (Leverage/Margin-Mode/Position-Mode) im Code. Auf
      # SPOT ist set_leverage() ein sicherer No-Op (ccxt meldet
      # setLeverage dort als nicht unterstuetzt, siehe
      # CCXTBaseAdapter.set_leverage() Docstring) - RISK_DEFAULT_LEVERAGE
      # unten aendert daher nichts am tatsaechlichen Exchange-Zustand,
      # dokumentiert aber die Absicht und greift bereits als reine
      # In-Process-Pruefung (RISK_MAX_LEVERAGE, Gross-Leverage-Check in
      # RiskEngine). Ein Wechsel zu echten Futures fuer Gordon ist eine
      # eigene, groessere, hier bewusst NICHT mitgemachte Entscheidung
      # (die 10 bestehenden Spot-Positionen wuerden fuer einen Futures-
      # Adapter unsichtbar).
      RISK_PROFILE_NAME: "TEST_1X"
      # 2026-09-24, operative Anweisung ("steigere das Risiko und setze
      # mehr Paper-Geld ein"): weitere Stufe nach der Aggressive-PAPER-
      # Validierungsphase (2026-09-22, siehe Historie oben). Bewusst noch
      # innerhalb bekannter Schema-Grenzen (max_open_positions<=50,
      # risk_per_trade_pct<=0.20) und nicht ueber den bereits an anderer
      # Stelle in dieser Datei referenzierten RiskLimitsConfig-Default
      # max_leverage=3.0 hinaus - keine willkuerliche Maximalausreizung,
      # sondern ein begruendeter, kontrollierter naechster Schritt (weiterhin
      # PAPER, kein echtes Geld). max_open_positions 8 -> 15, leverage
      # 2 -> 3, position_size_usd 20 -> 50 (2.5x mehr Kapital pro Trade).
      RISK_MAX_OPEN_POSITIONS: "15"
      RISK_DEFAULT_LEVERAGE: "3"
      RISK_MAX_LEVERAGE: "3"
      RISK_POSITION_SIZE_USD: "50"
      RISK_STOP_LOSS_PCT: "0.01"
      RISK_TAKE_PROFIT_PCT: "0.02"
      # 30 -> 240 Minuten (2026-09-24, operative Anweisung "hoehere
      # Gewinne"): mit 30 Minuten erreichte in der Praxis so gut wie
      # keine Position ueberhaupt den TP-(+2%) oder SL-(-1%)-Schwellenwert
      # - beobachtet ueber 3h Gordon-Produktionslogs: 24/24 Closes hatten
      # close_reason=max_holding_time, 0 via take_profit_hit/stop_loss_hit.
      # Der TP/SL-Mechanismus war dadurch faktisch wirkungslos, jede
      # Position wurde de facto rein zeitgetrieben (unabhaengig vom
      # tatsaechlichen PnL) geschlossen - kein gewinnorientiertes
      # Verhalten. 240 Minuten gibt Positionen realistisch mehr Zeit, die
      # konfigurierten Gewinn-/Verlust-Schwellen tatsaechlich zu
      # erreichen, BEVOR die Zeitgrenze eingreift. Kein Backtest-belegter
      # "optimaler" Wert - eine begruendete Anpassung, keine
      # Scheingenauigkeit. RISK_STOP_LOSS_PCT/RISK_TAKE_PROFIT_PCT selbst
      # bewusst unveraendert (kein Beleg fuer bessere Werte vorhanden).
      RISK_MAX_HOLDING_MINUTES: "240"
      # 0.01 -> 0.02 und 50 -> 200 (2026-09-24, gleiche Anweisung wie oben):
      # max_order_notional muss den erhoehten position_size_usd*leverage
      # (50*3=150) mit Puffer abdecken, sonst wuerde dieser Wert faelschlich
      # zum bindenden Limit statt RISK_POSITION_SIZE_USD/RISK_MAX_LEVERAGE.
      RISK_RISK_PER_TRADE_PCT: "0.02"
      RISK_MAX_ORDER_NOTIONAL: "200"
      # Nur Positionen, die AB diesem Zeitpunkt eroeffnet werden, erhalten
      # SL/TP/Max-Holding-Schutz - die 10 bereits offenen Legacy-
      # Positionen bleiben bewusst unangetastet (siehe sgr/risk/
      # position_protection.py Modul-Docstring und Deployment-Entscheidung:
      # Cleanup erfolgt separat, erst nach bestaetigtem E2E-Beweis).
      RISK_PROTECTION_CUTOVER_AT: "2026-09-16T10:40:36+00:00"
      # 2026-09-26, operative Anweisung ("dynamisches 25-Prozent-Exposure-
      # Limit"): globaler, equity-relativer Cap ueber ALLE gleichzeitig
      # offenen Positionen (direktional UND Grid kombiniert) - siehe
      # RiskLimitsConfig.max_total_exposure_pct und GridRiskLimitsConfig.
      # max_total_exposure_pct Docstrings. Beide auf denselben Wert
      # gesetzt (0.25 = 25%), da beide zusammen das EINE geforderte
      # Gesamt-Cap bilden sollen, nicht zwei unabhaengige Limits. Faengt
      # bei aktueller Konfiguration (position_size_usd=50 x max_open_
      # positions=15 = max. 750 USD direktional) aktuell nicht real, weil
      # dieser strukturelle Ceiling deutlich unter 25% von 10000 USD
      # Startkapital (2500 USD) liegt - siehe Phase-10-Abschlussbericht
      # fuer die vollstaendige Herleitung. Bewusst NICHT durch ein
      # blindes Anheben von max_open_positions/position_size_usd
      # "erzwungen" (explizite Anweisung: keine anderen Limits blind
      # aendern, nur um 25% zu erreichen).
      RISK_MAX_TOTAL_EXPOSURE_PCT: "0.25"
      GRID_RISK_MAX_TOTAL_EXPOSURE_PCT: "0.25"

      SENTRY_DSN: ${SENTRY_DSN:-}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
        
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    
    # Resource limits (Can be higher/lower than API)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  worker-sumo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: sgr-worker:latest
    container_name: sgr-worker-sumo
    hostname: worker-sumo
    networks:
      sgr-net:
        ipv4_address: 172.28.1.22
        
    # NO ports exposed - internal only
    
    env_file:
      - path: ../.env.prod
        required: false
      - path: ../.env
        required: false
        
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      
      ENVIRONMENT: production
      TRADING_MODE: paper
      
      LOG_LEVEL: info
      
      WORKER_ROLE: trading
      # Siehe ausfuehrlichen Kommentar bei worker-gordon oben: TENANT_ID
      # muss die echte users.id-UUID sein, kein Klartext-Name.
      TENANT_ID: 144f7bb0-113d-4c66-b5d3-7a34ab1d551a

      # Siehe ausfuehrlichen Kommentar bei worker-gordon oben: manueller
      # Override auf explizite operative Anweisung, kein Go-Live-Signal.
      # Aggressive PAPER-Validierungsphase (2026-09-22): momentum_v1/
      # breakout_v1/volatility_adjusted_momentum_v1 ergaenzt, identisch
      # zu Gordon - Sumo behaelt zusaetzlich sein eigenes mean_reversion_v1.
      # 2026-09-24, operative Anweisung ("gehe viel auf future grid") -
      # siehe ausfuehrlichen Kommentar beim identischen Block bei
      # worker-gordon oben.
      STRATEGY_FORCE_ACTIVATE: "trend_following_v1,mean_reversion_v1,momentum_v1,breakout_v1,volatility_adjusted_momentum_v1,futures_grid_long_v1,futures_grid_short_v1,futures_grid_adaptive_v1"
      GRID_SCHEDULER_ENABLED: "true"

      # PAPER-Stress-Test Auto-Recovery (2026-09-22) - siehe ausfuehrlichen
      # Kommentar beim identischen Block bei worker-gordon oben.
      PAPER_STRESS_AUTO_RECOVERY_ENABLED: "true"

      # TEST_1X Risk Profile (Angleichung an Gordon, 2026-09-17) - siehe
      # ausfuehrlichen Kommentar beim identischen Block bei worker-gordon
      # oben fuer die vollstaendige Begruendung jedes einzelnen Feldes.
      # Identischer Mechanismus (Service-level environment:-Override,
      # hat Vorrang vor .env.prod), identische Werte - Gordon und Sumo
      # sollen ab diesem Deploy unter demselben kontrollierten Profil
      # laufen.
      #
      # WICHTIG (Befund, siehe Bericht Punkt 3): RISK_PROTECTION_CUTOVER_AT
      # wirkt NICHT rueckwirkend - PositionProtectionManager.
      # on_position_opened() laeuft genau EINMAL, beim Oeffnen einer
      # Position. Sumos 10 bereits offene Positionen wurden VOR diesem
      # Deploy ohne SL/TP/Max-Holding eroeffnet und bleiben es auch nach
      # diesem Fix dauerhaft - der Cutover-Wert unten schuetzt nur
      # Positionen, die AB dem tatsaechlichen Deploy-Zeitpunkt neu
      # eroeffnet werden. Cleanup der 10 Legacy-Positionen ist eine
      # separate, hier bewusst NICHT mitgemachte Entscheidung (siehe
      # identisches Vorgehen bei Gordons eigenen Legacy-Positionen).
      #
      # Wert unten = Zeitpunkt dieser Aenderung (2026-09-17). Falls der
      # tatsaechliche Deploy spaeter erfolgt, VOR dem Deploy auf die
      # echte Deploy-Zeit aktualisieren, sonst waeren zwischenzeitlich
      # (zwischen dieser Aenderung und dem eigentlichen Rollout) neu
      # eroeffnete Positionen faelschlich ungeschuetzt.
      RISK_PROFILE_NAME: "TEST_1X"
      # 2026-09-24, operative Anweisung ("steigere das Risiko und setze
      # mehr Paper-Geld ein"): weitere Stufe nach der Aggressive-PAPER-
      # Validierungsphase (2026-09-22, siehe Historie oben). Bewusst noch
      # innerhalb bekannter Schema-Grenzen (max_open_positions<=50,
      # risk_per_trade_pct<=0.20) und nicht ueber den bereits an anderer
      # Stelle in dieser Datei referenzierten RiskLimitsConfig-Default
      # max_leverage=3.0 hinaus - keine willkuerliche Maximalausreizung,
      # sondern ein begruendeter, kontrollierter naechster Schritt (weiterhin
      # PAPER, kein echtes Geld). max_open_positions 8 -> 15, leverage
      # 2 -> 3, position_size_usd 20 -> 50 (2.5x mehr Kapital pro Trade).
      RISK_MAX_OPEN_POSITIONS: "15"
      RISK_DEFAULT_LEVERAGE: "3"
      RISK_MAX_LEVERAGE: "3"
      RISK_POSITION_SIZE_USD: "50"
      RISK_STOP_LOSS_PCT: "0.01"
      RISK_TAKE_PROFIT_PCT: "0.02"
      # 30 -> 240 Minuten (2026-09-24, operative Anweisung "hoehere
      # Gewinne"): mit 30 Minuten erreichte in der Praxis so gut wie
      # keine Position ueberhaupt den TP-(+2%) oder SL-(-1%)-Schwellenwert
      # - beobachtet ueber 3h Gordon-Produktionslogs: 24/24 Closes hatten
      # close_reason=max_holding_time, 0 via take_profit_hit/stop_loss_hit.
      # Der TP/SL-Mechanismus war dadurch faktisch wirkungslos, jede
      # Position wurde de facto rein zeitgetrieben (unabhaengig vom
      # tatsaechlichen PnL) geschlossen - kein gewinnorientiertes
      # Verhalten. 240 Minuten gibt Positionen realistisch mehr Zeit, die
      # konfigurierten Gewinn-/Verlust-Schwellen tatsaechlich zu
      # erreichen, BEVOR die Zeitgrenze eingreift. Kein Backtest-belegter
      # "optimaler" Wert - eine begruendete Anpassung, keine
      # Scheingenauigkeit. RISK_STOP_LOSS_PCT/RISK_TAKE_PROFIT_PCT selbst
      # bewusst unveraendert (kein Beleg fuer bessere Werte vorhanden).
      RISK_MAX_HOLDING_MINUTES: "10"  # PROFILE B (worker-sumo only): 240 -> 10, siehe Block unten
      # 0.01 -> 0.02 und 50 -> 200 (2026-09-24, gleiche Anweisung wie oben):
      # max_order_notional muss den erhoehten position_size_usd*leverage
      # (50*3=150) mit Puffer abdecken, sonst wuerde dieser Wert faelschlich
      # zum bindenden Limit statt RISK_POSITION_SIZE_USD/RISK_MAX_LEVERAGE.
      RISK_RISK_PER_TRADE_PCT: "0.02"
      RISK_MAX_ORDER_NOTIONAL: "200"
      RISK_PROTECTION_CUTOVER_AT: "2026-09-17T22:40:46+00:00"
      # 2026-09-26, operative Anweisung ("dynamisches 25-Prozent-Exposure-
      # Limit") - identische Begruendung wie im worker-gordon-Service oben.
      RISK_MAX_TOTAL_EXPOSURE_PCT: "0.25"
      GRID_RISK_MAX_TOTAL_EXPOSURE_PCT: "0.25"
      #
      # ===================================================================
      # PAPER TEST PROFILE B (2026-09-26, "naechste grosse SGR Testphase":
      # systematische Profitabilitaets-Untersuchung ueber Profile A-I).
      # NUR auf worker-sumo - worker-gordon bleibt bewusst unveraendert auf
      # Profile A (Produktionskonfiguration) als gleichzeitig laufende
      # Vergleichs-Baseline. Isolierte Variable: Trading-Frequenz/-Turnover.
      # UNVERAENDERT gegenueber Profile A/Produktion: RISK_POSITION_SIZE_USD
      # (50), RISK_MAX_OPEN_POSITIONS (15), RISK_STOP_LOSS_PCT (1%),
      # RISK_TAKE_PROFIT_PCT (2%) - keines der 5 geschuetzten Risk-Limits
      # oder der Chance-Risiko-Parameter wird hier angefasst, ausschliesslich
      # Signal-Frequenz und Positions-Turnover.
      #
      # PAPER_TEST_FAST_TIMEFRAME/PAPER_TEST_DISABLE_SYMBOL_GATE: bereits
      # aus der vorherigen Testphase bekannte, funktionierende Mechanismen
      # (siehe SGRConfig-Docstrings) - ohne den Symbol-Gate-Bypass wuerden
      # strukturell 0 Signale entstehen (Capability Scan: 873/943 validierte
      # Symbole aktuell no_valid_strategy), der 1m-Feed allein haette dann
      # keinen messbaren Effekt. Bypass bleibt auf die 24 kuratierten
      # Symbole beschraenkt (_PAPER_TEST_SYMBOL_GATE_ALLOWLIST in
      # sgr/strategy/engine.py), nicht das gesamte Universum.
      PAPER_TEST_FAST_TIMEFRAME: "1m"
      PAPER_TEST_DISABLE_SYMBOL_GATE: "true"
      RISK_TRADE_COOLDOWN_SECONDS: "20"
      # RISK_MAX_HOLDING_MINUTES fuer Profile B ist weiter oben in diesem
      # Service direkt an der bestehenden Zeile gesetzt (240 -> 10), um
      # keinen doppelten YAML-Key zu erzeugen.
      # ===================================================================

      SENTRY_DSN: ${SENTRY_DSN:-}
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
        
    restart: unless-stopped
    
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

# ============================================================================
# Volumes
# ============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  prometheusdata:
    driver: local
  grafanadata:
    driver: local
