[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgr"
version = "0.1.0"
description = "Project SGR – Institutional AI-powered Multi-Asset Trading System"
requires-python = ">=3.11"
dependencies = [
    # Async
    "asyncio-mqtt>=0.16.0",

    # Exchange connectivity
    "ccxt>=4.3.0",

    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",

    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "polars>=0.20.0",
    "scipy>=1.13.0",

    # DB
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",

    # Config & Secrets
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",

    # Logging & Monitoring
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",

    # HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.32.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pyotp>=2.9.0",

    # Utilities
    "orjson>=3.10.0",
    "arrow>=1.3.0",
    "tenacity>=8.3.0",

    # Sentiment (mit Keyword-Fallback falls nicht installiert)
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "hmmlearn>=0.3.0",
    "arch>=7.0.0",
    "shap>=0.45.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sgr --cov-report=term-missing --cov-fail-under=85"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["sgr"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Hier gehören alle Linter-Regeln und Einstellungen hin
select = [
    "E",    # pycodestyle-Fehler (z. B. Zeilenlänge)
    "W",    # pycodestyle-Warnungen
    "F",    # Pyflakes (z. B. ungenutzte Imports)
    "I",    # isort (Import-Sortierung)
    "UP",   # pyupgrade (z. B. StrEnum-Migrationen)
    "ANN",  # flake8-annotations (Typ-Annotationen)
    "B",    # flake8-bugbear (z. B. bare except)
]
ignore = [
    "ANN101", # Fehlendes 'self' Typ-Annotation in Methoden (veraltet)
    "ANN102", # Fehlendes 'cls' Typ-Annotation in Classmethods
	"ANN401", # Erlaubt die explizite Nutzung von 'Any' (wichtig für Middleware/Dekoratoren)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.coverage.run]
source = ["sgr"]
omit = ["*/migrations/*", "*/tests/*"]
